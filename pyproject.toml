[project]
name = "system-one-lab"
version = "0.1.0"
description = "Benchmarking System One models against LLMs for typed decisions in Python."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Victor Vieira", email = "victor@bidu.guru" }]
keywords = ["system-one", "typesafe", "jev", "pydantic-ai", "evals", "benchmark"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Private :: Do Not Upload",
]

dependencies = [
    # Typed agents against the System One model and the OpenRouter baselines.
    "pydantic-ai-slim[typesafe,openai]>=2.46",
    "pydantic-evals>=2.46",
    "pydantic>=2.9",
    # Deterministic dataset generation and versioned artifacts.
    "faker>=40.0",
    "pyyaml>=6.0",
    # Local configuration and report rendering.
    "python-dotenv>=1.0",
    "rich>=13.9",
]

[project.optional-dependencies]
# Statistical name detection. Installed on demand: the Portuguese pipeline is a
# large download and the deterministic layer must keep working without it.
ner = [
    "spacy>=3.8",
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
]
# Observability is never required to run an evaluation.
obs = [
    "langfuse>=2.53",
    "logfire>=1.0",
]

[project.scripts]
lab = "lab.run:main"

[project.urls]
Repository = "https://github.com/victorbvieira/system-one-lab"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lab", "anonimizador"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "canarios: PII recall checks that must stay at 100% in CI",
    "rede: requires an API key and network access",
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["lab", "anonimizador", "tests"]
